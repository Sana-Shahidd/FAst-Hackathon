<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}" data-theme="{{ theme }}" data-text-size="{{ text_size }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07142B">
  <title>{% block title %}{{ paper_name }} · {{ t('app.tagline') }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ fonts_url }}">
  <link rel="stylesheet" href="/static/app.css">
  <style>:root { --lang-display: "{{ font_display }}"; --lang-ui: "{{ font_ui }}"; }</style>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <div class="frame">
    {% block body %}{% endblock %}
  </div>
  {% block bottom_nav %}{% endblock %}
</body>
</html>
